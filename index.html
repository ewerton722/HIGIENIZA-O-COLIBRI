<!doctype html>
<html lang="pt-BR" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Higienização Colibri | Links</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Outfit', sans-serif;
      /* Fundo Degradê Escuro conforme a imagem */
      background: radial-gradient(circle at top right, #1a2a3a, #0f172a, #050505);
      background-attachment: fixed;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
    }

    /* Efeito de Vidro (Glassmorphism) */
    .glass-card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 40px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 400px;
      padding: 40px 30px;
      text-align: center;
    }

    /* Anel de brilho ao redor da logo */
    .logo-ring {
      width: 130px;
      height: 130px;
      margin: 0 auto 20px;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(to right, #e94560, #4ade80, #3b82f6);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px rgba(74, 222, 128, 0.2);
    }

    .logo-bg {
      background: #0f172a;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-bg img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 1px;
      background: linear-gradient(to right, #4ade80, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }

    .bio {
      font-size: 14px;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 30px;
    }

    /* Botões seguindo as cores exatas da imagem */
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 16px;
      margin-bottom: 15px;
      border-radius: 25px;
      font-weight: 600;
      font-size: 16px;
      transition: all 0.3s ease;
      text-decoration: none;
      color: white;
    }

    .btn-instagram {
      background: linear-gradient(to right, #b046a0, #e94560);
    }

    .btn-whatsapp {
      background: linear-gradient(to right, #4ade80, #16a34a);
    }

    .btn-services {
      background: rgba(255, 255, 255, 0.9);
      color: #0f172a;
    }

    .btn:hover {
      transform: translateY(-3px);
      filter: brightness(1.1);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
    }

    .footer {
      margin-top: 30px;
      font-size: 12px;
      color: #475569;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .footer hr {
      width: 40px;
      border: 0.5px solid rgba(255, 255, 255, 0.1);
    }

    /* Ícones das redes sociais (SVG para ficar leve) */
    .icon { width: 20px; height: 20px; fill: currentColor; }
  </style>
</head>
